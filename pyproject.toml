
[project]
name = "xant"
version = "0.1.0"
description = "Spatial antenna analysis with xarray."
authors = [{ name = "Rob Scheeler"}]
readme = "README.md"
license = {file = "LICENSE"}
keywords = ["python"]
requires-python = ">=3.11,<4"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "pint",
    "numpy",
    "scipy",
    "xarray",
    "matplotlib",
    "hics[geo]>=0.1.2",
    "h3",
    "loguru",
    "numba>=0.64.0",
    "h5py",
    "h5netcdf",
    "xrench>=0.1.2",
]

[dependency-groups]
dev = [
    "mypy >=1.16.1",
    "nox>=2025.5.1",
    "pytest>=8.4.1",
    "coverage>=7.8.2",
    "ruff>=0.12.0",
    "taskipy>=1.14.1",
    "portray>=1.8.0",
    "legacy-cgi>=2.6.3",
    "setuptools>=80.9.0",
    "pre-commit>=4.2.0",
    "ipykernel",
    "pyvista[jupyter]>=0.47.1",
]

[project.urls]
homepage = "https://github.com/rscheeler/xant"
repository = "https://github.com/rscheeler/xant.git"
documentation = "https://rscheeler.github.io/xant"
issues = "https://github.com/rscheeler/xant/issues"

[build-system]
requires = ["uv-build"]
build-backend = "uv_build"


[tool.taskipy.tasks]
format = { cmd = "ruff format ./src/", help = "Format code using ruff" }
lint = { cmd = "ruff check --fix ./src/", help = "Lint code using ruff" }
type = { cmd = "mypy --strict ./src/", help = "Typecheck code using mypy" }
docs = { cmd = "portray in_browser", help = "Serve documentation in browser" }
serve = { cmd = "portray server", help = "Serve documentation" }
html = { cmd = "portray as_html", help = "Build HTML documentation" }
publish = { cmd = "portray on_github_pages", help = "Publish documentation on GitHub Pages" }
tests = { cmd = "pytest --verbose --color=yes tests", help = "Run all tests using pytest" }
nox = { cmd = "nox -s tests", help = "Run tests in a nox session" }
coverage = { cmd = "coverage run -m pytest tests && coverage report", help = "Generate coverage report" }
run = { cmd = "uv run ./src/xant/xant.py", help = "Run main application" }
bump-patch   = { cmd = "python scripts/bump.py patch",   help = "Bump patch version and commit" }
bump-minor   = { cmd = "python scripts/bump.py minor",   help = "Bump minor version and commit" }
bump-major   = { cmd = "python scripts/bump.py major",   help = "Bump major version and commit" }
tag-and-push = { cmd = "python scripts/bump.py tag-and-push", help = "Tag current version and push to origin" }

[tool.ruff]
line-length = 100
indent-width = 4
format.indent-style = "space"
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
pydocstyle.convention = "google"
fixable = ["ALL"]
select = ["ALL"]
ignore = [
    "FA102", # Flake8-future-annotations
    "F401", # Disable fix for unused imports
    "B904", # Allow raising exceptions without from e
    "PLR0913", # too many arguments
    "CPY", # Flake8-copyright
    "T201", # Debugging print statements
    "ERA", # Eradicate – detects commented-out code
    "BLE001", # Catch-all exceptions
    "D100", # missing docstring in public module
    "D105", # undocumented magic method
    "D107", # undocumented public init
    "D203", # incorrect-blank-line-before-class
    "D205", # line-between-summary-and-description
    "D212", # multi-line-summary-first-line
    "D400", # missing-trailing-period
    "D407", # missing-dashed-underline-after-section
    "S311", # rand-usage
    "EM102", # f-string-exception
    "TRY003", # long-exception-messages
    "ANN001",   # missing type annotations on args
    "ANN002",   # missing type annotations on *args
    "ANN003",   # missing type annotations on **kwargs
    "ANN201",   # missing return type annotation
    "ANN202",   # missing return type annotation private
    "FBT001",   # boolean positional arg in function definition
    "FBT002",   # boolean default positional arg
    "FBT003",   # boolean positional value in call
    "PLR0912",  # too many branches
    "PLR0915",  # too many statements
    "PLR2004",  # magic value comparisons
    "C901",     # too complex
    "TID252",   # relative imports from parent modules
    "ICN001",   # matplotlib import alias
    "D103",     # missing docstring in public function
    "D415",     # docstring first line punctuation
    "N806",     # variable should be lowercase (e.g. matrix A)
    "E501",     # line too long — handled by formatter
]


[tool.mypy]
files = ["src", "tests"]
ignore_missing_imports = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
# To disable a specific error code globally in mypy
disable_error_code = ["no-untyped-def"]

disallow_any_unimported = false
no_implicit_optional = true
check_untyped_defs = false
warn_return_any = false
warn_unused_ignores = true
show_error_codes = true

[tool.coverage.report]
skip_empty = true
show_missing = true
fail_under = 70

[tool.coverage.run]
branch = true
source = ["src"]
omit = ["_*.py", "__*.py"]

[tool.portray.mkdocs]
site_name = "xant"

[tool.portray.mkdocs.theme]
name = "material"
custom_dir = "docs"
palette = {scheme= "slate", primary="deep purple", accent="purple"}
